packages:
  - 'packages/*'

catalog:
  '@vitejs/plugin-vue': ^6.0.7
  '@vitejs/plugin-vue-jsx': ^5.1.5
  '@vueuse/core': ^14.3.0
  typescript: ^6.0.3
  vite: ^8.0.16
  vue: ^3.5.38
  'es-toolkit': ^1.47.1
  'type-fest': ^5.7.0
  oxlint: ^1.71.0
  oxfmt: ^0.55.0
  'vite-plus': ^0.1.24

overrides:
  astro@<6.1.10: ^6.1.10
  astro@<6.4.6: ^6.4.6
  axios@>=1.0.0 <1.15.1: '>=1.15.1'
  axios@>=1.0.0 <1.15.2: '>=1.15.2'
  brace-expansion@>=5.0.0 <5.0.6: ^5.0.6
  braces@<3.0.3: '>=3.0.3'
  devalue@>=5.6.3 <=5.8.0: ^5.8.1
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@<=3.1.0: '>=3.1.1'
  fast-uri@<=3.1.1: '>=3.1.2'
  flatted@<3.4.0: '>=3.4.0'
  flatted@<=3.4.1: '>=3.4.2'
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  js-cookie@<=3.0.5: ^3.0.6
  js-yaml@<=4.1.1: ^4.1.2
  micromatch@<4.0.8: '>=4.0.8'
  postcss@<8.4.31: '>=8.4.31'
  postcss@<8.5.10: '>=8.5.10'
  trim-newlines@<3.0.1: '>=3.0.1'
  trim@<0.0.3: '>=0.0.3'
  undici@<6.27.0: ^6.27.0
  undici@>=7.0.0 <7.28.0: ^7.28.0
  undici@>=7.23.0 <7.28.0: ^7.28.0
  ws@>=8.0.0 <8.20.1: ^8.20.1
  yargs-parser@>=6.0.0 <13.1.2: '>=13.1.2'
shellEmulator: true
shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  vue-inbrowser-compiler-demi: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@esbuild/*'
  - '@oxc-project/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@voidzero-dev/*'
  - oxfmt
  - oxlint
  - vite-plus
  - astro
  - '@astrojs/*'
  - satteri
  - '@bruits/*'
  - '@napi-rs/wasm-runtime@1.1.6'
  - '@tybys/wasm-util@0.10.3'
  - '@types/node'
  - undici@7.28.0
  - undici@6.27.0
trustLockfile: true
