name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    name: Select browser suites
    runs-on: ubuntu-latest
    outputs:
      vue: ${{ steps.specs.outputs.vue }}
      browser: ${{ steps.specs.outputs.browser }}
      docsPages: ${{ steps.specs.outputs.docsPages }}
      docsPreview: ${{ steps.specs.outputs.docsPreview }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Route tests by changed paths
        id: suites
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          vue=false
          react=false
          docs=false
          # Push and PR checkouts are compared to their previous tip or PR base.
          # Scheduled/manual runs and unavailable bases use full coverage.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=
            vue=true
            react=true
            docs=true
          else
            git diff --name-only --no-renames -z "$BASE" HEAD > "$RUNNER_TEMP/browser-changes"
            while IFS= read -r -d '' file; do
              case "$file" in
                .github/workflows/browser-tests.yml|scripts/select-browser-specs.ts|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                  BASE=; vue=true; react=true; docs=true ;;
                .github/workflows/vue-browser-shards.yml)
                  BASE=; vue=true ;;
                packages/web-vue/scripts/find-affected-cypress-specs.ts|packages/web-vue/scripts/browser-source-imports.ts|scripts/browser-dependency-graph.ts)
                  BASE=; vue=true; react=true ;;
                packages/web-core/*)
                  vue=true; react=true ;;
                packages/sd-vue-docs/*|packages/web-vue/cypress/e2e/*|packages/web-vue/cypress.theme.config.ts|packages/web-vue/cypress.markdown.config.ts)
                  docs=true ;;
                packages/web-vue/*)
                  vue=true ;;
                packages/web-react/*)
                  react=true ;;
              esac
            done < "$RUNNER_TEMP/browser-changes"
          fi

          printf 'base=%s\nvue=%s\nreact=%s\ndocs=%s\n' "$BASE" "$vue" "$react" "$docs" >> "$GITHUB_OUTPUT"
      - name: Install selector dependencies
        if: steps.suites.outputs.base != '' && (steps.suites.outputs.vue == 'true' || steps.suites.outputs.react == 'true')
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          corepack enable
          pnpm run install:ci
      - name: Select affected specs and distribute them to shards
        id: specs
        env:
          BASE: ${{ steps.suites.outputs.base }}
          VUE: ${{ steps.suites.outputs.vue }}
          REACT: ${{ steps.suites.outputs.react }}
          DOCS: ${{ steps.suites.outputs.docs }}
        run: node scripts/select-browser-specs.ts

  vue:
    needs: select
    if: needs.select.outputs.vue != '[]'
    uses: ./.github/workflows/vue-browser-shards.yml
    with:
      ref: ${{ github.sha }}
      shards: ${{ needs.select.outputs.vue }}

  prepare-react:
    name: Prepare React cache and docs preview
    needs: select
    if: needs.select.outputs.browser != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Cache React E2E dependencies
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .pnpm-store
            ~/.cache/Cypress
          key: e2e-react-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --store-dir .pnpm-store
      - name: Save React E2E cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .pnpm-store
            ~/.cache/Cypress
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build docs site
        if: needs.select.outputs.docsPreview == 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm run build:docs
      - uses: actions/upload-artifact@v7
        if: needs.select.outputs.docsPreview == 'true'
        with:
          name: browser-test-docs
          path: packages/sd-vue-docs/dist
          if-no-files-found: error
          retention-days: 7

  browser:
    name: ${{ matrix.initials == 'docs' && 'Documentation browser tests' || format('React browser tests ({0})', matrix.initials) }}
    needs: [select, prepare-react]
    if: needs.select.outputs.browser != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.browser) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Restore React E2E cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .pnpm-store
            ~/.cache/Cypress
          key: e2e-react-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --store-dir .pnpm-store
      - uses: actions/download-artifact@v8
        if: matrix.docsPreview
        with:
          name: browser-test-docs
          path: packages/sd-vue-docs/dist
      - name: Build React browser fixtures' workspace dependencies
        if: matrix.initials != 'docs'
        run: pnpm --filter @sdata/web-react... run build
      - name: Run browser tests
        shell: bash
        env:
          INITIALS: ${{ matrix.initials }}
          SPECS: ${{ matrix.specs }}
          DOCS_PAGES: ${{ needs.select.outputs.docsPages }}
          DOCS_PREVIEW: ${{ matrix.docsPreview }}
          VUE_DOCS: ${{ matrix.vueDocs }}
          CYPRESS_BASE_URL: http://127.0.0.1:5188
        run: |
          trap 'jobs -pr | xargs -r kill || true' EXIT
          if [ "$DOCS_PREVIEW" = true ]; then
            pnpm --filter @sd-design/sd-vue-docs run astro preview --host 127.0.0.1 --port 5188 &
            curl --retry 60 --retry-delay 1 --retry-connrefused --max-time 5 -fsS http://127.0.0.1:5188/ -o /dev/null
          fi

          if [ "$INITIALS" = docs ]; then
            status=0
            args=(--posix-exit-codes --spec "$SPECS")
            if [ "$VUE_DOCS" = true ]; then
              pnpm --filter @sdata/web-vue run test:theme:e2e --posix-exit-codes || status=1
              pnpm --filter @sdata/web-vue run test:markdown:e2e --posix-exit-codes || status=1
            elif [ -n "$DOCS_PAGES" ]; then
              args+=(--expose "docsFrameworks=react,docsPages=$DOCS_PAGES")
            fi
            pnpm --filter @sdata/web-react run test:docs:e2e "${args[@]}" || status=1
            exit "$status"
          else
            pnpm --filter @sdata/web-react run serve:e2e &
            node packages/web-react/scripts/serve-upload-test.ts &
            curl --retry 60 --retry-delay 1 --retry-connrefused --max-time 5 -fsS http://127.0.0.1:5190/ -o /dev/null
            curl --retry 60 --retry-delay 1 --retry-connrefused --max-time 5 -fsS http://127.0.0.1:5192/state -o /dev/null
            cd packages/web-react
            CYPRESS_BASE_URL=http://127.0.0.1:5190 pnpm run test:e2e --posix-exit-codes --spec "$SPECS"
          fi
