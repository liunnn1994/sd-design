name: Vue browser shards

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      shards:
        required: true
        type: string

permissions:
  contents: read

jobs:
  vue:
    name: Vue browser tests (${{ matrix.initials }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@v5
        with:
          install_args: 'node npm:pnpm'
      - name: Restore Vue E2E cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .pnpm-store
            ~/.cache/Cypress
          key: e2e-vue-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.mise.toml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store
      - name: Save Vue E2E cache
        if: matrix.initials == fromJSON(inputs.shards)[0].initials && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .pnpm-store
            ~/.cache/Cypress
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build Vue test dependencies
        run: pnpm --filter @sdata/web-vue run icongen
      - name: Build React examples for the Vue theme editor spec
        if: contains(format(',{0},', matrix.specs), ',components/config-provider/__test__/theme-editor.cy.ts,')
        run: pnpm --filter @sdata/web-react run build
      - name: Run Vue browser tests
        working-directory: packages/web-vue
        timeout-minutes: 90
        env:
          SPECS: ${{ matrix.specs }}
        run: node scripts/run-cypress-shard.ts "$SPECS"
