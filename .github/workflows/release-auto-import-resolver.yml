name: Release auto-import-resolver

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-auto-import-resolver.yml
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/auto-import-resolver/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # 独立 concurrency 组：不与其它 release workflow 共享。共享组会在一次 push 同时触发
  # 多个 release workflow 时无差别取消其中一个 pending run（曾导致 mcp / resolver 漏发版）。
  # Resolver 不提交版本文件到 main；版本仅写入发布包并由 resolver-v* tag 跟踪，避免并发写分支。
  group: release-auto-import-resolver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@sdata'

      - name: Install dependencies
        run: |
          corepack enable
          node -v
          pnpm -v
          pnpm run install:ci

      - name: Test release scope
        run: pnpm --filter @sdata/web-vue-auto-import-resolver run test:release

      - name: Build release package
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm --filter @sdata/web-vue-auto-import-resolver run build

      - name: Sync with latest main before release
        run: git pull --rebase origin main

      - name: Release auto-import-resolver
        working-directory: packages/auto-import-resolver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # semantic-release 的 git push 不应被本地开发者用的 pre-push 钩子拦截
          # （该钩子会跑全量 typecheck，而 resolver workflow 未构建 web-vue 产物，
          # 会导致 docs typecheck 找不到 @sdata/web-vue/es/icon 而失败、中断发布）
          SKIP_SIMPLE_GIT_HOOKS: '1'
        run: pnpm exec semantic-release

      - name: Show error
        if: failure()
        run: |
          pnpm vp run --last-details
