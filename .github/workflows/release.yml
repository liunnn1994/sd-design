name: Release web-vue

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/web-vue/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@sdata'

      - name: Install dependencies
        run: |
          corepack enable
          node -v
          pnpm -v
          pnpm run install:ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        id: test
        run: |
          if pnpm run test:ci; then
            echo "snapshots_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "test:ci failed; retrying with snapshot update..."
          pnpm run test:ci -- -u
          echo "snapshots_updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated snapshots
        if: steps.test.outputs.snapshots_updated == 'true'
        env:
          SKIP_SIMPLE_GIT_HOOKS: '1'
        run: |
          snapshot_status="$(git status --porcelain -- '*.snap')"
          if [ -z "$snapshot_status" ]; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          echo "$snapshot_status"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.snap'

          non_snapshot_files="$(git diff --cached --name-only -- ':!*.snap')"
          if [ -n "$non_snapshot_files" ]; then
            echo "Refusing to commit non-snapshot files:"
            echo "$non_snapshot_files"
            exit 1
          fi

          git commit -m "test: update snapshots [skip ci]"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build release package
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: pnpm --filter @sdata/web-vue run build

      - name: Sync with latest main before release
        run: git pull --rebase origin main

      - name: Release web-vue
        working-directory: packages/web-vue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # semantic-release 的 git push 不应被本地开发者用的 pre-push 钩子拦截
          # （该钩子会跑全量 typecheck，CI 发布时可能因缺少某些构建产物而中断发布）
          SKIP_SIMPLE_GIT_HOOKS: '1'
        run: pnpm exec semantic-release

      - name: Show error
        if: failure()
        run: |
          pnpm vp run --last-details
