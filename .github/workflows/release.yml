name: Release Core, Vue and React

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview versions and release notes without publishing
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # 独立 concurrency 组：不与其它 release workflow 共享。共享组会在一次 push 同时触发
  # 多个 release workflow 时无差别取消其中一个 pending run（曾导致 mcp / resolver 漏发版）。
  # 三个包在同一流程内按依赖顺序独立判断版本，避免跨 workflow 的依赖发布竞争。
  # 手动预览使用独立队列，避免替换等待中的正式发布。
  group: release-web-vue-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run-' || '' }}${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify npm trusted publishing
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: 'node npm:pnpm'
          cache: false
      - name: Verify npm trusted publishing before validation and tagging
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: node packages/web-vue/scripts/verify-npm-publishing.ts

  browser:
    needs: preflight
    uses: ./.github/workflows/browser-tests.yml
    with:
      full_suite: true

  non-browser:
    needs: preflight
    uses: ./.github/workflows/non-browser-tests.yml

  release:
    needs: [browser, non-browser]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Attach the validated commit to the release branch
        run: git switch -c "$GITHUB_REF_NAME"

      - uses: jdx/mise-action@v5
        with:
          install_args: 'node npm:pnpm'
          cache: false
      - name: Configure npm registry
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          scope: '@sdata'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          node -v
          pnpm -v
          pnpm run install:ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate shared foundations and compatibility
        run: pnpm run test:foundations

      - name: Validate affected-specs selector
        working-directory: packages/web-vue
        run: pnpm run test:affected:unit

      - name: Validate independent package releases
        run: node --test packages/web-vue/scripts/release-packages.test.ts packages/web-vue/scripts/verify-npm-publishing.test.ts

      - name: Build release package
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: |
          pnpm --filter @sdata/web-vue run build
          pnpm --filter @sdata/web-react run build

      - name: Release changed packages in dependency order
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # semantic-release 的 git push 不应被本地开发者用的 pre-push 钩子拦截
          # （该钩子会跑全量 typecheck，CI 发布时可能因缺少某些构建产物而中断发布）
          SKIP_SIMPLE_GIT_HOOKS: '1'
        run: |
          check_main_tip() {
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then return; fi
            local head remote
            head=$(git rev-parse HEAD)
            remote=$(git ls-remote --exit-code origin refs/heads/main)
            remote=${remote%%$'\t'*}
            if [[ "$head" != "$remote" ]]; then
              printf '::error::Release checkout %s is stale. Main is at %s. The latest main needs its own successful release checks.\n' "$head" "$remote"
              return 1
            fi
          }

          check_main_tip
          node packages/web-vue/scripts/bootstrap-core-release.ts
          args=()
          if [ "$RELEASE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          for package in web-core web-vue web-react; do
            node packages/web-vue/node_modules/semantic-release/bin/semantic-release.js --extends ./packages/$package/release.config.ts "${args[@]}"
            check_main_tip
          done

      - name: Show error
        if: failure()
        run: |
          pnpm vp run --last-details
