name: Release Core, Vue and React

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/web-core/**
      - packages/web-vue/**
      - packages/web-react/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview versions and release notes without publishing
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # 独立 concurrency 组：不与其它 release workflow 共享。共享组会在一次 push 同时触发
  # 多个 release workflow 时无差别取消其中一个 pending run（曾导致 mcp / resolver 漏发版）。
  # 三个包在同一流程内按依赖顺序独立判断版本，避免跨 workflow 的依赖发布竞争。
  group: release-web-vue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select release browser tests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.specs.outputs.ref }}
      vue: ${{ steps.specs.outputs.vue }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Verify npm trusted publishing before validation and tagging
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: node packages/web-vue/scripts/verify-npm-publishing.ts
      - name: Select affected component shards
        id: specs
        env:
          BASE: ${{ github.event.before }}
          VUE: 'true'
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            corepack enable
            pnpm run install:ci
          else
            export BASE=
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/select-browser-specs.ts

  vue:
    needs: select
    if: needs.select.outputs.vue != '[]'
    uses: ./.github/workflows/vue-browser-shards.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
      shards: ${{ needs.select.outputs.vue }}

  release:
    needs: [select, vue]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.vue.result == 'success' || (needs.vue.result == 'skipped' && needs.select.outputs.vue == '[]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.ref }}

      - name: Attach the validated commit to the release branch
        run: git switch -c "$GITHUB_REF_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@sdata'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          corepack enable
          node -v
          pnpm -v
          pnpm run install:ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate shared foundations and compatibility
        run: pnpm run test:foundations

      - name: Validate affected-specs selector
        working-directory: packages/web-vue
        run: pnpm run test:affected:unit

      - name: Validate independent package releases
        run: node --test packages/web-vue/scripts/release-packages.test.ts packages/web-vue/scripts/verify-npm-publishing.test.ts

      - name: Test React adapters
        run: pnpm --filter @sdata/web-react test

      - name: Build release package
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: |
          pnpm --filter @sdata/web-vue run build
          pnpm --filter @sdata/web-react run build

      - name: Release changed packages in dependency order
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # semantic-release 的 git push 不应被本地开发者用的 pre-push 钩子拦截
          # （该钩子会跑全量 typecheck，CI 发布时可能因缺少某些构建产物而中断发布）
          SKIP_SIMPLE_GIT_HOOKS: '1'
        run: |
          node packages/web-vue/scripts/bootstrap-core-release.ts
          args=()
          if [ "$RELEASE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          for package in web-core web-vue web-react; do
            node packages/web-vue/node_modules/semantic-release/bin/semantic-release.js --extends ./packages/$package/release.config.ts "${args[@]}"
          done

      - name: Show error
        if: failure()
        run: |
          pnpm vp run --last-details
