name: Non-browser tests

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm run install:ci
      - name: Prepare Vue test dependencies
        run: |
          pnpm --filter @sdata/web-react... run build
          pnpm --filter @sdata/web-vue run icongen
      - name: Run Vue non-browser tests
        run: pnpm --filter @sdata/web-vue run test:non-browser

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm run install:ci
      - name: Build Core
        run: pnpm --filter @sdata/web-core run build
      - name: Run React non-browser tests
        run: pnpm --filter @sdata/web-react run test
