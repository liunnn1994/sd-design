name: Non-browser tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/web-core/**'
      - 'packages/web-vue/scripts/browser-source-imports.ts'
      - 'packages/web-vue/scripts/find-affected-cypress-specs*.ts'
      - 'packages/web-vue/scripts/run-cypress-shard*.ts'
      - 'scripts/*browser*.ts'
      - '.github/workflows/non-browser-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/web-core/**'
      - 'packages/web-vue/scripts/browser-source-imports.ts'
      - 'packages/web-vue/scripts/find-affected-cypress-specs*.ts'
      - 'packages/web-vue/scripts/run-cypress-shard*.ts'
      - 'scripts/*browser*.ts'
      - '.github/workflows/non-browser-tests.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: 'node npm:pnpm'
      - name: Install dependencies
        run: pnpm run install:ci
      - name: Prepare Vue test dependencies
        run: |
          pnpm --filter @sdata/web-react... run build
          pnpm --filter @sdata/web-vue run icongen
      - name: Run Vue non-browser tests
        run: pnpm --filter @sdata/web-vue run test:non-browser

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: 'node npm:pnpm'
      - name: Install dependencies
        run: pnpm run install:ci
      - name: Run shared Core tests
        run: pnpm run test:core
      - name: Verify browser spec selection
        run: node --test scripts/select-browser-specs.test.ts packages/web-vue/scripts/find-affected-cypress-specs.test.ts
      - name: Run React non-browser tests
        run: pnpm --filter @sdata/web-react run test
